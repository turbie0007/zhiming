<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F4EFE4">
  <title>知命 · 排盤回歸測試</title>
  <style>
    :root {
      --paper: #f4efe4;
      --paper-2: #faf6ec;
      --ink: #2b2520;
      --ink-2: #5c534a;
      --ink-3: #8a7f72;
      --line: #ded3bf;
      --cinnabar: #a23b2f;
      --pass: #3f6b4f;
      --shadow: 0 24px 60px -40px rgba(43, 37, 32, 0.5);
      --serif: "Songti TC", "Noto Serif TC", "Source Han Serif TC", "STSong", serif;
      --sans: "PingFang TC", "Noto Sans TC", "Helvetica Neue", sans-serif;
      --mono: "SF Mono", "Menlo", "Consolas", monospace;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #17140f;
        --paper-2: #1f1b15;
        --ink: #ece4d6;
        --ink-2: #c2b6a4;
        --ink-3: #8f8477;
        --line: #3a332a;
        --cinnabar: #d98068;
        --pass: #8fbf9c;
        --shadow: 0 24px 60px -40px #000;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 20px 64px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 880px;
      margin: 0 auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 22px;
      color: var(--ink-3);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .back:hover { color: var(--cinnabar); }

    h1 {
      margin: 0 0 10px;
      font-family: var(--serif);
      font-size: clamp(26px, 4vw, 34px);
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .lede {
      max-width: 640px;
      margin: 0;
      color: var(--ink-2);
      font-size: 13px;
      line-height: 1.9;
    }

    .summary {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px 16px;
      margin: 26px 0 0;
      padding: 18px 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--paper-2);
      box-shadow: var(--shadow);
    }

    .summary .count {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .summary .count[data-state="pass"] { color: var(--pass); }
    .summary .count[data-state="fail"] { color: var(--cinnabar); }

    .summary .headline {
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--ink-2);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 18px 0 8px;
    }

    .toolbar button {
      height: 38px;
      padding: 0 20px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper-2);
      font-family: inherit;
      font-size: 12.5px;
      letter-spacing: 0.12em;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .toolbar button:hover {
      background: var(--cinnabar);
      border-color: var(--cinnabar);
      color: #fff7ea;
    }

    .toolbar .stamp {
      color: var(--ink-3);
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    .case {
      margin-top: 14px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-left: 3px solid var(--pass);
      border-radius: 14px;
      background: var(--paper-2);
    }

    .case[data-state="fail"] {
      border-left-color: var(--cinnabar);
    }

    .case header {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .case .no {
      color: var(--ink-3);
      font-family: var(--mono);
      font-size: 11px;
    }

    .case h2 {
      flex: 1;
      margin: 0;
      font-family: var(--serif);
      font-size: 15.5px;
      font-weight: 600;
      letter-spacing: 0.05em;
      line-height: 1.6;
    }

    .badge {
      flex: none;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--pass);
      background: color-mix(in srgb, var(--pass) 12%, transparent);
    }

    .case[data-state="fail"] .badge {
      color: var(--cinnabar);
      background: color-mix(in srgb, var(--cinnabar) 12%, transparent);
    }

    .note {
      margin: 8px 0 0;
      color: var(--ink-2);
      font-size: 12px;
      line-height: 1.8;
    }

    .meta {
      margin: 8px 0 0;
      color: var(--ink-3);
      font-family: var(--mono);
      font-size: 11px;
      line-height: 1.8;
    }

    table.checks {
      width: 100%;
      margin-top: 12px;
      border-collapse: collapse;
      font-size: 12px;
    }

    table.checks th,
    table.checks td {
      padding: 6px 8px;
      border-top: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    table.checks th {
      color: var(--ink-3);
      font-weight: 500;
      letter-spacing: 0.06em;
    }

    table.checks td {
      font-family: var(--mono);
    }

    table.checks tr[data-mismatch="true"] td {
      color: var(--cinnabar);
    }

    .error {
      margin: 10px 0 0;
      color: var(--cinnabar);
      font-family: var(--mono);
      font-size: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">← 返回知命</a>
    <h1>排盤回歸測試</h1>
    <p class="lede">以固定案例檢查節氣邊界、晚子時、真太陽時與已知日柱。改動排盤邏輯後，開啟本頁按「重新執行」，即可核對四柱與校正時間是否仍然一致。</p>

    <section class="summary" aria-live="polite">
      <span class="count" id="count">—</span>
      <span class="headline" id="headline">正在計算</span>
    </section>

    <div class="toolbar">
      <button type="button" id="rerun">重新執行</button>
      <span class="stamp" id="stamp"></span>
    </div>

    <section id="cases"></section>
  </main>

  <script type="module">
    import { computeChart, interactionSummary } from './assets/js/bazi.js?v=20261155';
    import { membershipActive, mergeRecords } from './assets/js/cloud.js?v=20261155';

    const BASE = { gender: 'male', city: '北京', lateZi: true, trueSolar: false };
    const gz = (p) => (p ? `${p.stemChar}${p.branchChar}` : '—');
    const pillarCheck = (chart) => ({
      年柱: gz(chart.pillars.year),
      月柱: gz(chart.pillars.month),
      日柱: gz(chart.pillars.day),
      時柱: gz(chart.pillars.hour),
    });

    const CASES = [
      {
        title: '立春前：年、月柱仍屬癸卯年',
        note: '2024 年立春在 2 月 4 日 16:26（北京時間）。16:00 出生應為癸卯年、乙丑月，日柱戊戌、申時庚申。',
        input: { solar: { y: 2024, m: 2, d: 4 }, time: { h: 16, min: 0 } },
        actual: (c) => ({ ...pillarCheck(c), 前一節: c.monthInfo.prevJie.name }),
        expect: { 年柱: '癸卯', 月柱: '乙丑', 日柱: '戊戌', 時柱: '庚申', 前一節: '小寒' },
      },
      {
        title: '立春後：年、月柱進入甲辰年',
        note: '同日 17:00 已過立春，年柱換甲辰、月柱換丙寅；日柱不因節氣而變，仍是戊戌。',
        input: { solar: { y: 2024, m: 2, d: 4 }, time: { h: 17, min: 0 } },
        actual: (c) => ({ ...pillarCheck(c), 前一節: c.monthInfo.prevJie.name }),
        expect: { 年柱: '甲辰', 月柱: '丙寅', 日柱: '戊戌', 時柱: '辛酉', 前一節: '立春' },
      },
      {
        title: '驚蟄前：月柱仍在寅月',
        note: '2024 年驚蟄在 3 月 5 日 10:22。09:00 出生，月柱仍為丙寅。',
        input: { solar: { y: 2024, m: 3, d: 5 }, time: { h: 9, min: 0 } },
        actual: (c) => ({ 月柱: gz(c.pillars.month), 日柱: gz(c.pillars.day), 時柱: gz(c.pillars.hour) }),
        expect: { 月柱: '丙寅', 日柱: '戊辰', 時柱: '丁巳' },
      },
      {
        title: '驚蟄後：月柱進入卯月',
        note: '同日 11:00 已過驚蟄，月柱換丁卯；日柱不變。',
        input: { solar: { y: 2024, m: 3, d: 5 }, time: { h: 11, min: 0 } },
        actual: (c) => ({ 月柱: gz(c.pillars.month), 日柱: gz(c.pillars.day), 時柱: gz(c.pillars.hour) }),
        expect: { 月柱: '丁卯', 日柱: '戊辰', 時柱: '戊午' },
      },
      {
        title: '已知日柱：1949-10-01 為甲子日',
        note: '常用校驗錨點：1949 年 10 月 1 日，農曆八月初十，己丑年癸酉月甲子日。',
        input: { solar: { y: 1949, m: 10, d: 1 }, time: { h: 12, min: 0 } },
        actual: (c) => ({
          ...pillarCheck(c),
          農曆: c.lunarText,
          大運: `${c.luck.directionLabel}（起運節 ${c.luck.targetJie}）`,
        }),
        expect: {
          年柱: '己丑', 月柱: '癸酉', 日柱: '甲子', 時柱: '庚午',
          農曆: '己丑年 八月初十', 大運: '陰年男逆行（起運節 白露）',
        },
      },
      {
        title: '已知日柱：2000-01-01 為戊午日',
        note: '2000 年 1 月 1 日，農曆己卯年冬月廿五，己卯年丙子月戊午日，午時戊午。',
        input: { solar: { y: 2000, m: 1, d: 1 }, time: { h: 12, min: 0 } },
        actual: (c) => ({ ...pillarCheck(c), 農曆: c.lunarText }),
        expect: {
          年柱: '己卯', 月柱: '丙子', 日柱: '戊午', 時柱: '戊午',
          農曆: '己卯年 冬月廿五',
        },
      },
      {
        title: '晚子時：預設 23:00 後換日',
        note: '2000-01-01 23:30，晚子時預設換日：日柱由戊午前進為己未，時柱按己日為甲子。',
        input: { solar: { y: 2000, m: 1, d: 1 }, time: { h: 23, min: 30 }, lateZi: true },
        actual: (c) => ({ 日柱: gz(c.pillars.day), 時柱: gz(c.pillars.hour) }),
        expect: { 日柱: '己未', 時柱: '甲子' },
      },
      {
        title: '晚子時：關閉換日時維持當日',
        note: '同一時刻關閉換日，日柱仍為戊午，時柱按戊日為壬子。',
        input: { solar: { y: 2000, m: 1, d: 1 }, time: { h: 23, min: 30 }, lateZi: false },
        actual: (c) => ({ 日柱: gz(c.pillars.day), 時柱: gz(c.pillars.hour) }),
        expect: { 日柱: '戊午', 時柱: '壬子' },
      },
      {
        title: '真太陽時：烏魯木齊跨回前一日',
        note: '烏魯木齊 00:30 出生，經度與均時差校正約 −133 分鐘，退回前一日 22:16，日柱丁巳、亥時辛亥。',
        input: {
          solar: { y: 2000, m: 1, d: 1 },
          time: { h: 0, min: 30 },
          city: '烏魯木齊',
          trueSolar: true,
        },
        actual: (c) => ({
          校正時間: c.calcDate,
          日柱: gz(c.pillars.day),
          時柱: gz(c.pillars.hour),
        }),
        expect: { 校正時間: '1999年12月31日 22:16', 日柱: '丁巳', 時柱: '辛亥' },
      },
      {
        title: '真太陽時不移動年、月柱',
        note: '2024-02-04 17:00 於烏魯木齊開啟真太陽時，鐘面校正後回退至 14:36，但年柱甲辰、月柱丙寅仍依立春絕對時刻判定。',
        input: {
          solar: { y: 2024, m: 2, d: 4 },
          time: { h: 17, min: 0 },
          city: '烏魯木齊',
          trueSolar: true,
        },
        actual: (c) => ({ ...pillarCheck(c), 校正時間: c.calcDate }),
        expect: {
          年柱: '甲辰', 月柱: '丙寅', 日柱: '戊戌', 時柱: '己未',
          校正時間: '2024年2月4日 14:36',
        },
      },
      {
        title: '時辰未知：時柱略去並提示',
        note: '不填時間時，時柱應為空、起運按正午估算，並產生提示。',
        input: { solar: { y: 2000, m: 1, d: 1 }, time: null },
        actual: (c) => ({
          時柱: c.pillars.hour ? gz(c.pillars.hour) : '無',
          時辰未知: c.timeUnknown,
          提示: c.warnings[0] || '無',
        }),
        expect: {
          時柱: '無',
          時辰未知: true,
          提示: '時辰未知：時柱、命宮、身宮已略去，起運時間按正午估算。',
        },
      },
      {
        title: '大運順逆：陰年男逆行、陰年女順行',
        note: '1949 年己丑為陰年：男命逆數到白露，女命順數到寒露。',
        run: () => {
          const base = { solar: { y: 1949, m: 10, d: 1 }, time: { h: 12, min: 0 }, city: '北京' };
          const male = computeChart({ ...BASE, ...base, gender: 'male' });
          const female = computeChart({ ...BASE, ...base, gender: 'female' });
          return {
            男命: `${male.luck.directionLabel}（起運節 ${male.luck.targetJie}）`,
            女命: `${female.luck.directionLabel}（起運節 ${female.luck.targetJie}）`,
          };
        },
        expect: {
          男命: '陰年男逆行（起運節 白露）',
          女命: '陰年女順行（起運節 寒露）',
        },
      },
      {
        title: '格局：月令本氣透干取七殺格',
        note: '甲辰 丙寅 戊戌 辛酉。寅藏甲丙戊，甲透年干，取七殺格；丙透月干，兼偏印格。身弱取火印為用。',
        input: { solar: { y: 2024, m: 2, d: 4 }, time: { h: 17, min: 0 } },
        actual: (c) => ({
          格局: c.structure.primary.name,
          取格把握: c.structure.primary.confidenceText,
          兼格: c.structure.candidates.slice(1).map((row) => row.name).join('、') || '無',
          用神: c.structure.useful.primary.label,
          用神方法: c.structure.useful.primary.methods.join('、'),
        }),
        expect: {
          格局: '七殺格', 取格把握: '高', 兼格: '偏印格',
          用神: '火', 用神方法: '扶抑、格局配合、調候',
        },
      },
      {
        title: '格局：月令本氣未透仍取正官格',
        note: '甲辰 丁卯 戊辰 戊午。卯藏乙正官，未見於年、月、時干，以本氣取正官格；中和以火通關、調候。',
        input: { solar: { y: 2024, m: 3, d: 5 }, time: { h: 11, min: 0 } },
        actual: (c) => ({
          格局: c.structure.primary.name,
          取格把握: c.structure.primary.confidenceText,
          用神: c.structure.useful.primary.label,
          用神方法: c.structure.useful.primary.methods.join('、'),
        }),
        expect: {
          格局: '正官格', 取格把握: '中',
          用神: '火', 用神方法: '扶抑、格局配合、通關、調候',
        },
      },
      {
        title: '格局：身弱正官格以印通關',
        note: '己丑 癸酉 甲子 庚午。酉月辛正官未透，取正官格；身弱以水印生扶。',
        input: { solar: { y: 1949, m: 10, d: 1 }, time: { h: 12, min: 0 } },
        actual: (c) => ({
          格局: c.structure.primary.name,
          用神: c.structure.useful.primary.label,
          用神方法: c.structure.useful.primary.methods.join('、'),
          忌: c.structure.useful.avoid.map((row) => row.label).join('、'),
        }),
        expect: {
          格局: '正官格', 用神: '水',
          用神方法: '扶抑、格局配合、調候', 忌: '土、金',
        },
      },
      {
        title: '格局：身強正財格取財星',
        note: '己卯 丙子 戊午 戊午。子月癸正財未透，取正財格；身強以水財耗身。',
        input: { solar: { y: 2000, m: 1, d: 1 }, time: { h: 12, min: 0 } },
        actual: (c) => ({
          格局: c.structure.primary.name,
          用神: c.structure.useful.primary.label,
          用神方法: c.structure.useful.primary.methods.join('、'),
        }),
        expect: { 格局: '正財格', 用神: '水', 用神方法: '扶抑' },
      },
      {
        title: '格局：月令臨官取建祿格',
        note: '甲辰 丙寅 甲辰 庚午。日主甲木臨官於寅，取建祿格；丙透月干兼食神格。',
        input: { solar: { y: 2024, m: 2, d: 10 }, time: { h: 12, min: 0 } },
        actual: (c) => ({
          格局: c.structure.primary.name,
          取格把握: c.structure.primary.confidenceText,
          兼格: c.structure.candidates.slice(1).map((row) => row.name).join('、') || '無',
          用神: c.structure.useful.primary.label,
        }),
        expect: { 格局: '建祿格', 取格把握: '高', 兼格: '食神格', 用神: '火' },
      },
      {
        title: '時間軸標記：子午沖＋甲庚沖',
        note: '原局甲子，流年庚午。地支子午相沖、天干甲庚相沖，皆屬有害標記。',
        run: () => {
          const r = interactionSummary([{ stem: 0, branch: 0, source: '年柱' }], { stem: 6, branch: 6, source: '流年' });
          return { 種類: r.kinds.join(','), 有害: String(r.harm), 含子午沖: String(r.texts.includes('子午相沖')) };
        },
        expect: { 種類: 'chong', 有害: 'true', 含子午沖: 'true' },
      },
      {
        title: '時間軸標記：子丑合化土',
        note: '原局甲子，流年乙丑。地支子丑合化土，屬合會（非有害）。',
        run: () => {
          const r = interactionSummary([{ stem: 0, branch: 0, source: '年柱' }], { stem: 1, branch: 1, source: '流年' });
          return { 種類: r.kinds.join(','), 有害: String(r.harm), 含子丑合: String(r.texts.includes('子丑合化土')) };
        },
        expect: { 種類: 'he', 有害: 'false', 含子丑合: 'true' },
      },
      {
        title: '時間軸標記：只計與目標柱相關',
        note: '原局甲子＋庚午本身子午沖，但流年丙寅與两者無合沖刑害；目標柱標記應為空，不被原局內部互動污染。',
        run: () => {
          const r = interactionSummary(
            [{ stem: 0, branch: 0, source: '年柱' }, { stem: 6, branch: 6, source: '月柱' }],
            { stem: 2, branch: 2, source: '流年' },
          );
          return { 種類: r.kinds.join(','), 有害: String(r.harm), 文字數: String(r.texts.length) };
        },
        expect: { 種類: '', 有害: 'false', 文字數: '0' },
      },
      {
        title: '會員資格：active 且未過期才有效',
        note: 'membershipActive 只認 status=active 且 current_period_end 在未來；過期、欠費、無資料皆非會員。',
        run: () => {
          const future = new Date(Date.now() + 86400000).toISOString();
          const past = new Date(Date.now() - 86400000).toISOString();
          return {
            有效: String(membershipActive({ status: 'active', current_period_end: future })),
            過期: String(membershipActive({ status: 'active', current_period_end: past })),
            欠費: String(membershipActive({ status: 'past_due', current_period_end: future })),
            無: String(membershipActive(null)),
          };
        },
        expect: { 有效: 'true', 過期: 'false', 欠費: 'false', 無: 'false' },
      },
      {
        title: '雲端同步：last-write-wins 合併與 tombstone',
        note: 'remote 較新則覆蓋本機（a）；本機較新則保留並列入上傳（b）；remote tombstone 較新則刪除本機（c）。',
        run: () => {
          const local = [
            { id: 'a', createdAt: '2026-01-01T00:00:00Z', updatedAt: '2026-01-01T00:00:00Z', note: 'localA' },
            { id: 'b', createdAt: '2026-01-01T00:00:00Z', updatedAt: '2026-03-01T00:00:00Z', note: 'localB' },
            { id: 'c', createdAt: '2026-01-01T00:00:00Z', updatedAt: '2026-01-01T00:00:00Z', note: 'localC' },
          ];
          const remote = [
            { record_id: 'a', payload: { note: 'remoteA' }, updated_at: '2026-02-01T00:00:00Z', deleted: false },
            { record_id: 'b', payload: { note: 'remoteB' }, updated_at: '2026-02-01T00:00:00Z', deleted: false },
            { record_id: 'c', payload: {}, updated_at: '2026-02-01T00:00:00Z', deleted: true },
          ];
          const r = mergeRecords(local, remote);
          const byId = Object.fromEntries(r.merged.map((x) => [x.id, x.note]));
          return {
            a: byId.a,
            b: byId.b,
            c已刪: String(byId.c === undefined),
            上傳: r.toPush.map((x) => x.record_id).join(','),
          };
        },
        expect: { a: 'remoteA', b: 'localB', c已刪: 'true', 上傳: 'b' },
      },
      {
        title: '神煞完整化：戊戌日魁罡＋年月吉煞',
        note: '甲辰 丙寅 戊戌 辛酉。日柱戊戌為魁罡；年支辰見金輿、紅艷；月支寅見福星、學堂；時干辛為月德合。',
        input: { solar: { y: 2024, m: 2, d: 4 }, time: { h: 17, min: 0 } },
        actual: (c) => ({
          日魁罡: String(c.pillars.day.shensha.includes('魁罡')),
          年金輿: String(c.pillars.year.shensha.includes('金輿')),
          年紅艷: String(c.pillars.year.shensha.includes('紅艷煞')),
          月福星: String(c.pillars.month.shensha.includes('福星貴人')),
          月學堂: String(c.pillars.month.shensha.includes('學堂')),
          時月德合: String(c.pillars.hour.shensha.includes('月德合')),
        }),
        expect: { 日魁罡: 'true', 年金輿: 'true', 年紅艷: 'true', 月福星: 'true', 月學堂: 'true', 時月德合: 'true' },
      },
      {
        title: '神煞完整化：戊午日詞館勾煞、月柱災煞絞煞',
        note: '己卯 丙子 戊午 戊午。日干戊詞館在午，日支午為勾煞（年支卯前三位）；月支子見災煞、絞煞。',
        input: { solar: { y: 2000, m: 1, d: 1 }, time: { h: 12, min: 0 } },
        actual: (c) => ({
          日詞館: String(c.pillars.day.shensha.includes('詞館')),
          日勾煞: String(c.pillars.day.shensha.includes('勾煞')),
          月災煞: String(c.pillars.month.shensha.includes('災煞')),
          月絞煞: String(c.pillars.month.shensha.includes('絞煞')),
        }),
        expect: { 日詞館: 'true', 日勾煞: 'true', 月災煞: 'true', 月絞煞: 'true' },
      },
      {
        title: '神煞完整化：甲子日非魁罡、月柱學堂時柱災煞',
        note: '己丑 癸酉 甲子 庚午。月支酉為己干學堂；丑年巳酉丑局災煞在午，時支午見災煞、紅艷；甲子日非魁罡。',
        input: { solar: { y: 1949, m: 10, d: 1 }, time: { h: 12, min: 0 } },
        actual: (c) => ({
          月學堂: String(c.pillars.month.shensha.includes('學堂')),
          時災煞: String(c.pillars.hour.shensha.includes('災煞')),
          時紅艷: String(c.pillars.hour.shensha.includes('紅艷煞')),
          日魁罡: String(c.pillars.day.shensha.includes('魁罡')),
        }),
        expect: { 月學堂: 'true', 時災煞: 'true', 時紅艷: 'true', 日魁罡: 'false' },
      },
      {
        title: '天德貴人與天德合：丁酉年壬寅月',
        note: '2017-02-04 已過立春，丁酉年壬寅月。寅月天德在丁，年干丁見天德貴人；天德合在壬，月干壬見天德合。',
        input: { solar: { y: 2017, m: 2, d: 4 }, time: { h: 12, min: 0 } },
        actual: (c) => ({
          年柱: gz(c.pillars.year),
          月柱: gz(c.pillars.month),
          年天德: String(c.pillars.year.shensha.includes('天德貴人')),
          月天德合: String(c.pillars.month.shensha.includes('天德合')),
        }),
        expect: { 年柱: '丁酉', 月柱: '壬寅', 年天德: 'true', 月天德合: 'true' },
      },
    ];

    const esc = (value) => String(value)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');

    function runCase(item) {
      try {
        let chart = null;
        let values;
        if (item.run) {
          values = item.run();
        } else {
          chart = computeChart({ ...BASE, ...item.input });
          values = item.actual(chart);
        }
        const rows = Object.keys(item.expect).map((key) => ({
          key,
          expected: String(item.expect[key]),
          actual: String(values[key]),
          ok: String(values[key]) === String(item.expect[key]),
        }));
        const passed = rows.every((row) => row.ok);
        const meta = chart
          ? `公曆 ${chart.calcDate} · 農曆 ${chart.lunarText} · 四柱 ${chart.pillarList.map(gz).join(' · ')}`
          : '';
        return { passed, rows, meta, error: null };
      } catch (err) {
        return { passed: false, rows: [], meta: '', error: err?.message || String(err) };
      }
    }

    function render() {
      const results = CASES.map(runCase);
      const passed = results.filter((r) => r.passed).length;
      const allPass = passed === results.length;

      const count = document.getElementById('count');
      count.textContent = `${passed} / ${results.length}`;
      count.dataset.state = allPass ? 'pass' : 'fail';
      document.getElementById('headline').textContent = allPass
        ? '全部案例通過'
        : `${results.length - passed} 項未通過，請檢查排盤邏輯`;
      document.getElementById('stamp').textContent = `執行於 ${new Date().toLocaleString('zh-TW', { hour12: false })}`;

      document.getElementById('cases').innerHTML = results.map((result, i) => {
        const item = CASES[i];
        const state = result.passed ? 'pass' : 'fail';
        const rows = result.rows.map((row) => `
          <tr data-mismatch="${row.ok ? 'false' : 'true'}">
            <th>${esc(row.key)}</th>
            <td>${esc(row.expected)}</td>
            <td>${esc(row.actual)}</td>
          </tr>
        `).join('');
        const table = result.passed ? '' : `
          <table class="checks">
            <thead><tr><th>檢查項</th><th>期望</th><th>實際</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        `;
        return `
          <article class="case" data-state="${state}">
            <header>
              <span class="no">${String(i + 1).padStart(2, '0')}</span>
              <h2>${esc(item.title)}</h2>
              <span class="badge">${result.passed ? '通過' : result.error ? '執行錯誤' : '未通過'}</span>
            </header>
            <p class="note">${esc(item.note)}</p>
            ${result.meta ? `<p class="meta">${esc(result.meta)}</p>` : ''}
            ${result.error ? `<p class="error">${esc(result.error)}</p>` : ''}
            ${table}
          </article>
        `;
      }).join('');
    }

    document.getElementById('rerun').addEventListener('click', render);
    render();
  </script>
</body>
</html>
